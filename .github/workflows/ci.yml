name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .
      - name: mypy
        run: mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # oldest supported version (requires-python >= 3.9); not provided on ubuntu-latest
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: pytest
        run: python -m pytest -q
      - name: Demo smoke test
        run: mergeweather demo --no-open --plain --out demo-report
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: demo-report
          path: demo-report/
          retention-days: 14

  build:
    name: Build & verify package
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: twine check --strict dist/*
      - name: Wheel contains report assets and entry point
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          required = ["mergeweather/assets/report.css", "mergeweather/assets/report.js",
                      "mergeweather/fixtures.py", "mergeweather/cli.py"]
          missing = [r for r in required if r not in names]
          assert not missing, f"missing from wheel: {missing}"
          eps = [n for n in names if n.endswith("entry_points.txt")]
          assert eps and "mergeweather = mergeweather.cli:main" in zipfile.ZipFile(whl).read(eps[0]).decode()
          print(f"{whl}: {len(names)} files OK")
          PY
      - name: Install wheel in a clean venv and run the demo
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/mergeweather --version
          /tmp/wheel-venv/bin/mergeweather demo --no-open -q --out /tmp/wheel-demo
          test -s /tmp/wheel-demo/report.html
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
