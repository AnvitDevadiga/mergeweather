name: 🐛 Bug report
description: Something in MergeWeather is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search
        [existing issues](https://github.com/AnvitDevadiga/merge-weather/issues) first.
        **Don't paste secrets:** `report.json` contains branch diffs and test output.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The full `mergeweather …` command line.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Terminal output (use `--plain` for copyable logs) or report excerpts.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (exploration / reduction / fingerprints)
        - Git handling (refs, merges, conflicts)
        - Sandbox (Docker / local runner)
        - Terminal dashboard
        - HTML / Markdown / JSON report
        - explain (LLM explanation)
        - Packaging / installation
        - Other
    validations:
      required: true
  - type: dropdown
    id: sandbox
    attributes:
      label: Sandbox backend
      options: [docker, local, auto, not applicable]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MergeWeather version
      description: Output of `mergeweather --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, git version (and Docker version if relevant)
      placeholder: "macOS 15, Python 3.12.4, git 2.45, Docker 27.1"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I removed secrets and private code from anything pasted above.
          required: true
