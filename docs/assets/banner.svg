<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="MergeWeather: behavioral weather forecasting for Git">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.6" stop-color="#18181b"/>
      <stop offset="1" stop-color="#2a0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="78" width="56" height="56" rx="14" fill="url(#logo)"/>
    <text x="100" y="117" font-size="30" text-anchor="middle">🌤</text>
    <text x="146" y="118" font-size="44" font-weight="700" fill="#fafafa" letter-spacing="-1">MergeWeather</text>
    <text x="74" y="186" font-size="30" font-weight="600" fill="#e4e4e7" letter-spacing="-0.5">Behavioral weather forecasting for Git</text>
    <text x="74" y="228" font-size="19" fill="#a1a1aa">Every branch is green. Every pair is green. The release is on fire.</text>
    <text x="74" y="256" font-size="19" fill="#a1a1aa">MergeWeather finds the exact set of branches that breaks together.</text>
    <g font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15">
      <rect x="74" y="284" width="472" height="38" rx="9" fill="#09090b" stroke="#3f3f46"/>
      <text x="92" y="308" fill="#71717a">$</text>
      <text x="110" y="308" fill="#e4e4e7">uvx … mergeweather demo</text>
    </g>
  </g>

  <!-- lattice: pairs pass, triple fails -->
  <g transform="translate(60,0)" stroke-width="3" fill="none">
    <path d="M790 110 C 880 110, 920 180, 1010 180" stroke="#fb7185"/>
    <path d="M790 180 L 1010 180" stroke="#fb7185"/>
    <path d="M790 250 C 880 250, 920 180, 1010 180" stroke="#fb7185"/>
    <path d="M660 110 L 790 110 M660 180 L790 110 M660 180 L790 250 M660 250 L790 250 M660 110 L790 180 M660 250 L790 180" stroke="#3f3f46" stroke-width="1.5"/>
  </g>
  <g transform="translate(60,0)" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13" fill="#d4d4d8">
    <circle cx="660" cy="110" r="11" fill="#4ade80"/><circle cx="660" cy="180" r="11" fill="#4ade80"/><circle cx="660" cy="250" r="11" fill="#4ade80"/>
    <text x="660" y="88" text-anchor="middle">A</text><text x="636" y="185" text-anchor="end">B</text><text x="660" y="281" text-anchor="middle">C</text>
    <circle cx="790" cy="110" r="13" fill="#4ade80" stroke="#09090b" stroke-width="3"/>
    <circle cx="790" cy="180" r="13" fill="#4ade80" stroke="#09090b" stroke-width="3"/>
    <circle cx="790" cy="250" r="13" fill="#4ade80" stroke="#09090b" stroke-width="3"/>
    <text x="790" y="86" text-anchor="middle">A+B ☀</text><text x="790" y="284" text-anchor="middle">B+C ☀</text>
    <text x="820" y="168">A+C ☀</text>
    <circle cx="1010" cy="180" r="30" fill="#fb7185" fill-opacity="0.2"/>
    <circle cx="1010" cy="180" r="18" fill="#fb7185" stroke="#09090b" stroke-width="3"/>
    <text x="1010" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#fda4af">A+B+C ⛈</text>
    <text x="1010" y="252" text-anchor="middle" fill="#a1a1aa">proven 1-minimal</text>
  </g>
</svg>
