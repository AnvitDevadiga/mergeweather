[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mergeweather"
dynamic = ["version"]
description = "Forecast the storms your branches cause together: find behavioral failures that only appear when independently passing Git branches are merged."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anvit Devadiga" }]
keywords = ["git", "merge", "integration-testing", "ci", "branches", "delta-debugging", "flaky-tests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/AnvitDevadiga/merge-weather"
Repository = "https://github.com/AnvitDevadiga/merge-weather"
Issues = "https://github.com/AnvitDevadiga/merge-weather/issues"

[project.scripts]
mergeweather = "mergeweather.cli:main"

[tool.hatch.version]
path = "src/mergeweather/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mergeweather"]

[tool.hatch.build.targets.sdist]
include = ["src/mergeweather", "tests", "examples", "scripts", "README.md", "LICENSE", "Makefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
