[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mergeweather"
dynamic = ["version"]
description = "Forecast the storms your branches cause together: find behavioral failures that only appear when independently passing Git branches are merged."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anvit Devadiga" }]
keywords = ["git", "merge", "integration-testing", "ci", "branches", "delta-debugging", "flaky-tests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.17.4", "mypy==2.4.1; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/AnvitDevadiga/merge-weather"
Repository = "https://github.com/AnvitDevadiga/merge-weather"
Issues = "https://github.com/AnvitDevadiga/merge-weather/issues"

[project.scripts]
mergeweather = "mergeweather.cli:main"

[tool.hatch.version]
path = "src/mergeweather/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mergeweather"]

[tool.hatch.build.targets.sdist]
include = ["src/mergeweather", "tests", "examples", "scripts", "README.md", "LICENSE", "Makefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["src/mergeweather/assets"]

[tool.ruff.format]
# HTML templates use nested f-string quotes that must stay valid on Python < 3.12
exclude = ["src/mergeweather/html_report.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E741",    # short loop names like `l` for labels are idiomatic here
  "E501",    # long lines: HTML/Tailwind templates; the formatter handles code
  "SIM105",  # contextlib.suppress vs try/except: explicit is clearer in cleanup paths
  "RUF001",  # ambiguous unicode: intentional weather glyphs and typography
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["mergeweather"]

[tool.mypy]
python_version = "3.10"
files = ["src/mergeweather"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
